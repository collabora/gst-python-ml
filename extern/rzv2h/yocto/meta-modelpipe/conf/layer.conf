# meta-modelpipe adds the runtime stack ModelPipe needs on RZ/V2H.
#
# The RZ/V2H AI SDK v6.00 image is Yocto scarthgap (5.0.11) with GStreamer
# 1.22.x. ModelPipe requires GStreamer >= 1.24 (for GstAnalytics, the
# metadata type every mp_* element uses), the gst-python plugin loader, and
# numpy/pycairo/pygobject/opencv. This layer carries those additions.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "modelpipe"
BBFILE_PATTERN_modelpipe = "^${LAYERDIR}/"
BBFILE_PRIORITY_modelpipe = "20"

LAYERDEPENDS_modelpipe = "core openembedded-layer"
LAYERSERIES_COMPAT_modelpipe = "scarthgap styhead"
