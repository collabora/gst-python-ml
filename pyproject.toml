[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gst-python-ml"
version = "1.1.1"
description = "An ML package for GStreamer"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["COPYING"]
authors = [{name = "Aaron Boxer", email = "aaron.boxer@collabora.com"}]
urls.Homepage = "https://github.com/collabora/gst-python-ml"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygobject",
    "pycairo",
    "numpy",
    "scipy",
    "opencv-python-headless>=4.13.0; python_version >= '3.14'",
    "opencv-python-headless>=4.9.0; python_version < '3.14'",
    "torch>=2.11.0; python_version >= '3.14'",
    "torch>=2.7.0; python_version < '3.14'",
    "torchvision>=0.26.0; python_version >= '3.14'",
    "torchvision>=0.22.0; python_version < '3.14'",
    "transformers>=5.6.2; python_version >= '3.14'",
    "transformers>=4.44.0; python_version < '3.14'",
    "accelerate>=1.13.0",
    "huggingface-hub",
    "pillow",
    "sentencepiece",
    "protobuf",
    "pyopengl",
    # "flash-attn",
]

[project.optional-dependencies]
yolo = [
    "ultralytics",
    "lap",
]
llm = [
    "bitsandbytes>=0.49.2",
    "qwen-vl-utils[decord]>=0.0.8",
]
# gptqmodel builds its cuda kernels with nvcc on the first model load
awq = [
    "gptqmodel",
]
audio = [
    "torchaudio>=2.11.0; python_version >= '3.14'",
    "torchaudio>=2.7.0; python_version < '3.14'",
    "soundfile",
    "speechbrain",
    "whisperspeech",
    # fastprogress imports IPython.display at module scope
    "ipython",
]
diffusion = [
    "diffusers",
]
face = [
    "insightface",
]
superres = [
    "spandrel",
]
kafka = [
    "confluent_kafka",
]
mqtt = [
    "paho-mqtt",
]
onnx = [
    "onnxruntime",
]
onnx-gpu = [
    "onnxruntime-gpu",
]
tvm = [
    "apache-tvm",
]
tinygrad = [
    "tinygrad",
]
mlx = [
    "mlx>=0.20.0",
    "mlx-lm",
]
# linux has no metal, the cpu backend is a separate wheel
mlx-cpu = [
    "mlx[cpu]>=0.20.0",
]
executorch = [
    "executorch; python_version < '3.14'",
]
llamacpp = [
    "llama-cpp-python",
]
# candle: install manually (not on PyPI) - see README
jax-cpu = [
    "jax[cpu]",
    "flax",
]
jax-gpu = [
    "jax[cuda12]",
    "flax",
]
jax-tpu = [
    "jax[tpu]",
    "flax",
]
openvino = [
    "openvino>=2024.0",
]
tensorflow = [
    "tensorflow>=2.16.0",
]
litert = [
    "ai-edge-litert",
]
ncnn = [
    "ncnn",
]
iree = [
    "iree-base-runtime",
    "iree-base-compiler",
    "onnx",
]
vad = [
    "pysilero",
    "pysilero-vad",
    "faster-whisper",
]
mcp = [
    "mcp>=2.2.0",
]
all = [
    "gst-python-ml[onnx,tinygrad,llamacpp,openvino,tensorflow,litert,vad]",
    "gst-python-ml[yolo,llm,audio,diffusion,face,superres,kafka,mqtt]",
]

# Optional
[dependency-groups]
test = [
    "pytest>=9.0.3",
    # Add other test tools
]
dev = [
    {include-group = "test"},
    # Add linting, etc., e.g., "ruff"
]

[tool.pytest.ini_options]
markers = [
    "serial: run this test on its own, it needs the GPU or a capture device to itself",
]

[project.scripts]
pyml-launch = "pyml_launch:main"
pyml-mcp = "pyml_mcp:main"

[tool.setuptools]
include-package-data = true
py-modules = ["pyml_launch"]
package-dir = {"" = "plugins/python"}

[tool.setuptools.packages.find]
where = ["plugins/python"]