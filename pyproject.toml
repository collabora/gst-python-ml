[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gst-python-ml"
version = "1.3.0"
description = "An ML package for GStreamer"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["COPYING"]
authors = [{name = "Aaron Boxer", email = "aaron.boxer@collabora.com"}]
urls.Homepage = "https://github.com/collabora/gst-python-ml"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygobject; sys_platform != 'win32'",
    "pycairo; sys_platform != 'win32'",
    "numpy",
    "scipy",
    "opencv-python-headless>=4.13.0; python_version >= '3.14'",
    "opencv-python-headless>=4.9.0; python_version < '3.14'",
    "torch>=2.11.0; python_version >= '3.14'",
    "torch>=2.7.0; python_version < '3.14'",
    "torchvision>=0.26.0; python_version >= '3.14'",
    "torchvision>=0.22.0; python_version < '3.14'",
    "transformers>=5.5; python_version >= '3.14'",
    "transformers>=4.44.0; python_version < '3.14'",
    "accelerate>=1.13.0",
    "huggingface-hub",
    "pillow",
    "sentencepiece",
    "protobuf",
    "pyopengl",
    # "flash-attn",
]

[project.optional-dependencies]
yolo = [
    "ultralytics",
    "lap",
    # the ultralytics onnx export folds its shape ops only with this installed
    "onnxslim>=0.1.71",
]
llm = [
    "bitsandbytes>=0.49.2",
    "qwen-vl-utils[decord]>=0.0.8",
]
# gptqmodel builds its cuda kernels with nvcc on the first model load
awq = [
    "gptqmodel",
]
audio = [
    "torchaudio>=2.11.0; python_version >= '3.14'",
    "torchaudio>=2.7.0; python_version < '3.14'",
    "soundfile",
    "speechbrain",
    "whisperspeech",
    # fastprogress imports IPython.display at module scope
    "ipython",
]
diffusion = [
    "diffusers",
]
face = [
    "insightface",
]
superres = [
    "spandrel",
]
skia = [
    "skia-python",
]
kafka = [
    "confluent_kafka",
]
mqtt = [
    "paho-mqtt",
]
onnx = [
    "onnxruntime",
    "onnxruntime-genai",
    "onnxscript",
]
onnx-gpu = [
    "onnxruntime-gpu",
    "onnxruntime-genai-cuda",
    "onnxscript",
]
tvm = [
    "apache-tvm",
]
tinygrad = [
    "tinygrad",
]
mlx = [
    "mlx>=0.20.0",
    "mlx-lm",
]
# linux has no metal, the cpu backend is a separate wheel
mlx-cpu = [
    "mlx[cpu]>=0.20.0",
]
executorch = [
    "executorch; python_version < '3.14'",
]
llamacpp = [
    "llama-cpp-python",
]
jax-cpu = [
    "jax[cpu]",
    "flax",
    "keras-hub>=0.32",
    "grain",
]
jax-gpu = [
    "jax[cuda12]",
    "flax",
    "keras-hub>=0.32",
    "grain",
]
jax-tpu = [
    "jax[tpu]",
    "flax",
    "keras-hub>=0.32",
    "grain",
]
openvino = [
    "openvino>=2024.0",
    "openvino-genai",
    "optimum-intel",
]
tensorflow = [
    "tensorflow>=2.16.0",
    # the onnx2tf pin is the one ultralytics installs on its own exports
    "onnx2tf>=1.26.3,<1.29.0",
    "tf-keras",
    # onnx2tf imports these without declaring them
    "sng4onnx>=1.0.1",
    "onnx_graphsurgeon>=0.3.26",
    "ai-edge-litert",
]
litert = [
    "ai-edge-litert",
]
ncnn = [
    "ncnn",
    "pnnx",
    "onnx",
]
rknn = [
    "rknn-toolkit-lite2>=2.3.2; platform_machine == 'aarch64' and python_version == '3.12'",
]
iree = [
    "iree-base-runtime",
    "iree-base-compiler",
    "onnx",
]
vad = [
    "pysilero",
    "pysilero-vad",
    "faster-whisper",
]
mcp = [
    "mcp>=2.2.0",
]
all = [
    "gst-python-ml[onnx,tinygrad,llamacpp,openvino,tensorflow,litert,vad]",
    "gst-python-ml[yolo,llm,audio,diffusion,face,superres,skia,kafka,mqtt]",
]

# Optional
[dependency-groups]
test = [
    "pytest>=9.0.3",
    # Add other test tools
]
dev = [
    {include-group = "test"},
    # Add linting, etc., e.g., "ruff"
]

[tool.pytest.ini_options]
markers = [
    "serial: run this test on its own, it needs the GPU or a capture device to itself",
]

[project.scripts]
pyml-launch = "gst_python_ml:launch"
pyml-mcp = "gst_python_ml:mcp"
pyml-engines = "gst_python_ml:engines"

[tool.hatch.build.targets.wheel]
only-include = ["plugins"]
exclude = ["plugins/python/gst_python_ml"]
sources = {"plugins" = "gst_python_ml/plugins"}
dev-mode-dirs = ["plugins/python"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/python/gst_python_ml/__init__.py" = "gst_python_ml/__init__.py"
"PIPELINES.md" = "gst_python_ml/PIPELINES.md"

[tool.hatch.build.targets.sdist]
only-include = ["plugins", "PIPELINES.md"]

[tool.uv]
# tensorflow-text has no python 3.14 wheel
override-dependencies = ["tensorflow-text; sys_platform == 'never'"]
